<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Trader Academy — Lectures</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #05070d;
    --bg-soft: #0a0e18;
    --panel: #0d1526;
    --panel-border: #1c2740;
    --blue: #2f5dff;
    --blue-bright: #5b82ff;
    --white: #f4f6fb;
    --muted: #93a0bd;
    --muted-dim: #5c6884;
  }
  *{box-sizing:border-box;}
  body{ margin:0; background:var(--bg); color:var(--white); font-family:'Inter', sans-serif; }
  h1,h2,h3{ font-family:'Sora', sans-serif; margin:0; }
  a{ color:inherit; }
  button{ font-family:inherit; }
  .wrap{ max-width:900px; margin:0 auto; padding:0 24px; }

  nav{
    position:sticky; top:0; z-index:90;
    background:rgba(5,7,13,0.9); backdrop-filter:blur(10px);
    border-bottom:1px solid var(--panel-border);
  }
  nav .wrap{ display:flex; align-items:center; justify-content:space-between; padding:12px 24px; }
  .brand{ display:flex; align-items:center; gap:10px; font-family:'Sora'; font-weight:700; font-size:15px; }
  .brand img{ width:28px; height:28px; border-radius:7px; }
  .brand a{ text-decoration:none; display:flex; align-items:center; gap:10px; color:var(--white); }

  .progress-panel{ display:flex; align-items:center; gap:14px; }
  .candle-frame{ position:relative; width:20px; height:38px; display:flex; align-items:flex-end; justify-content:center; }
  .candle-wick{ position:absolute; left:50%; bottom:0; width:2px; background:var(--muted-dim); transform:translateX(-50%); }
  .candle-body{
    position:relative; width:13px;
    background:linear-gradient(180deg, var(--blue-bright), var(--blue));
    border-radius:2px; min-height:4px; transition:height 0.5s ease; z-index:1;
  }
  .progress-text{ font-size:12.5px; color:var(--muted); white-space:nowrap; }
  .progress-text b{ color:var(--white); }
  #authArea a{ color:var(--muted); font-size:12.5px; text-decoration:none; margin-left:14px; }
  @keyframes glowPulse{ 0%,100%{ box-shadow:0 0 0 0 rgba(91,130,255,0); } 50%{ box-shadow:0 0 8px 2px rgba(91,130,255,0.5); } }
  .candle-body.growing{ animation:glowPulse 0.6s ease; }

  .page-head{ padding:56px 24px 36px; text-align:center; }
  .page-head .eyebrow{ color:var(--blue-bright); font-size:13px; font-weight:600; margin-bottom:10px; }
  .page-head h1{ font-size:clamp(28px,5vw,40px); margin-bottom:12px; }
  .page-head p{ color:var(--muted); font-size:15px; max-width:480px; margin:0 auto; }

  .journey{ position:relative; padding:10px 24px 90px; }
  .spine{
    position:absolute; left:50%; top:0; bottom:90px; width:0;
    border-left:2px dashed var(--panel-border);
    transform:translateX(-50%);
    z-index:0;
  }

  .sector-divider{ position:relative; z-index:2; text-align:center; margin:60px auto 34px; max-width:460px;
    opacity:0; transform:translateY(16px); transition:opacity 0.6s ease, transform 0.6s ease; }
  .sector-divider.in-view{ opacity:1; transform:translateY(0); }
  .sector-divider .tag{
    display:inline-flex; align-items:center; gap:8px;
    background:var(--panel); border:1px solid var(--panel-border);
    padding:10px 22px; border-radius:30px; font-family:'Sora'; font-weight:700; font-size:15px;
  }
  .sector-divider .tag .dot{ width:8px; height:8px; border-radius:50%; background:var(--blue-bright); }
  .sector-divider.bonus .tag .dot{ background:#ffd166; }
  .sector-divider .tagline{ margin-top:12px; font-size:13px; color:var(--muted); }

  .finish-divider{
    position:relative; z-index:2; display:flex; align-items:center; gap:12px;
    max-width:520px; margin:70px auto 0;
    opacity:0; transform:translateY(16px); transition:opacity 0.6s ease, transform 0.6s ease;
  }
  .finish-divider.in-view{ opacity:1; transform:translateY(0); }
  .finish-divider .line{ flex:1; height:1px; background:var(--panel-border); }
  .finish-divider .label{ font-family:'Sora'; font-weight:700; font-size:12.5px; letter-spacing:0.06em; color:var(--muted); white-space:nowrap; }

  .island-row{ position:relative; z-index:2; display:flex; margin:8px 0;
    opacity:0; transition:opacity 0.6s ease, transform 0.6s ease; }
  .island-row.left{ justify-content:flex-start; transform:translateX(-24px); }
  .island-row.right{ justify-content:flex-end; transform:translateX(24px); }
  .island-row.in-view{ opacity:1; transform:translateX(0); }

  .island-stack{ width:47%; min-width:230px; display:flex; flex-direction:column; align-items:center; }
  .island-row.left .island-stack{ align-items:flex-start; }
  .island-row.right .island-stack{ align-items:flex-end; }

  .island-btn{
    display:flex; align-items:center; gap:14px;
    background:none; border:none; padding:0; cursor:pointer; color:inherit;
    width:100%;
  }
  .island-row.right .island-btn{ flex-direction:row-reverse; text-align:right; }

  .island-circle{
    flex:none; width:64px; height:64px; border-radius:50%;
    background:var(--panel); border:2px solid var(--panel-border);
    display:flex; align-items:center; justify-content:center;
    font-family:'Sora'; font-weight:800; font-size:18px; color:var(--muted-dim);
    transition:background 0.25s ease, border-color 0.25s ease, transform 0.2s ease, color 0.25s ease;
  }
  .island-btn:hover .island-circle{ transform:scale(1.06); border-color:var(--blue); }
  .island-row.watched .island-circle{
    background:linear-gradient(160deg, var(--blue-bright), var(--blue));
    border-color:var(--blue-bright); color:#fff;
  }
  .island-row.next .island-circle{ animation:islandPulse 1.8s ease-in-out infinite; }
  @keyframes islandPulse{
    0%,100%{ box-shadow:0 0 0 0 rgba(91,130,255,0.45); }
    50%{ box-shadow:0 0 0 8px rgba(91,130,255,0); }
  }

  .island-title{ font-size:13.5px; color:var(--muted); line-height:1.35; max-width:170px; }
  .island-row.active .island-title, .island-row.watched .island-title{ color:var(--white); font-weight:600; }

  .island-panel{
    width:94%;
    max-height:0; overflow:hidden; opacity:0;
    transition:max-height 0.4s ease, opacity 0.3s ease, margin 0.3s ease;
    margin-top:0;
  }
  .island-panel.open{ max-height:900px; opacity:1; margin-top:18px; }
  .panel-card{
    background:var(--panel); border:1px solid var(--blue); border-radius:14px; padding:18px;
  }

  .big-thumb{
    position:relative; width:100%; aspect-ratio:16/9;
    background:linear-gradient(160deg, #101a30, #05070d);
    border-radius:10px; overflow:hidden;
    display:flex; align-items:center; justify-content:center;
  }
  .big-thumb img{ width:100%; height:100%; object-fit:cover; display:block; }
  .big-thumb iframe{ width:100%; height:100%; border:0; display:block; }
  .big-thumb .play-big{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; background:rgba(5,7,13,0.25); cursor:pointer; }
  .big-thumb .play-big svg{ width:54px; height:54px; filter:drop-shadow(0 2px 6px rgba(0,0,0,0.5)); transition:transform 0.2s ease; }
  .big-thumb .play-big:hover svg{ transform:scale(1.1); }
  .big-thumb .placeholder-note{ color:var(--muted-dim); font-size:13px; text-align:center; padding:0 24px; }

  .lesson-header{ display:flex; flex-wrap:wrap; align-items:center; gap:10px; margin-top:16px; }
  .lesson-header h3{ font-size:17px; flex:1; min-width:160px; text-align:left; }

  .icon-btn{
    display:inline-flex; align-items:center; gap:6px;
    background:var(--bg-soft); border:1px solid var(--panel-border); border-radius:8px;
    padding:7px 12px; font-size:12px; color:var(--muted); cursor:pointer;
    transition:border-color 0.2s ease, color 0.2s ease;
  }
  .icon-btn svg{ width:14px; height:14px; }
  .icon-btn.on{ color:var(--blue-bright); border-color:var(--blue); }
  .icon-btn.save-btn.on svg{ fill:var(--blue-bright); }

  .lesson-section{ margin-top:20px; text-align:left; }
  .lesson-section .panel-label{ font-size:11.5px; font-weight:600; letter-spacing:0.03em; color:var(--muted); margin-bottom:8px; }

  .notes-box{
    width:100%; min-height:70px; resize:vertical;
    background:var(--bg-soft); border:1px solid var(--panel-border); border-radius:10px;
    color:var(--white); font-family:'Inter'; font-size:13px; padding:11px;
  }
  .notes-box:focus{ outline:none; border-color:var(--blue); }

  .end-banner{ position:relative; z-index:2; text-align:center; margin-top:50px;
    opacity:0; transform:translateY(16px); transition:opacity 0.6s ease, transform 0.6s ease; }
  .end-banner.in-view{ opacity:1; transform:translateY(0); }
  .end-banner h3{ font-size:20px; margin-bottom:6px; }
  .end-banner p{ color:var(--muted); font-size:13.5px; }

  @media (max-width:640px){
    .island-stack{ width:82%; }
    .island-row.left, .island-row.right{ justify-content:center; }
    .island-row.left .island-stack, .island-row.right .island-stack{ align-items:flex-start; }
    .island-row.right .island-btn{ flex-direction:row; text-align:left; }
    .spine{ left:24px; }
    .island-panel{ width:100%; }
    .progress-text{ display:none; }
  }

  @media (prefers-reduced-motion: reduce){
    .island-row, .sector-divider, .finish-divider, .end-banner, .island-circle{
      animation:none !important; transition:none !important; opacity:1 !important; transform:none !important;
    }
  }
</style>
</head>

<div class="page-head">
  <div class="eyebrow">Members Only</div>
  <h1>Your Curriculum</h1>
  <p>Travel down the path at your own pace — click any island to open it up and watch.</p>
</div>

<div class="journey">
  <div class="spine"></div>
  <div id="journeyRoot" class="wrap" style="padding:0;"></div>
</div>

<script>
  // ---------------------------------------------------------------
  // EDIT THIS DATA to add your real lecture titles + YouTube links.
  // ---------------------------------------------------------------
  const SECTORS = [
    { name: "New to Trading", tagline: "Start here if you're brand new to the markets", lectures: [
      { title: "TradingView", url: "https://youtu.be/HVnrXOciCy4" },
      { title: "Candlestick Theory", url: "https://youtu.be/5xdbH2kE3tY" },
      { title: "Liquidity", url: "https://youtu.be/djqADrZ5fz0" },
      { title: "DOL and FVGs", url: "https://youtu.be/t9Y9uuLanXA" },
    ]},
    { name: "Foundations", tagline: "Core manipulation and displacement concepts", lectures: [
      { title: "Turtle Soup vs Liquidity Sweep", url: "https://youtu.be/3vIJMgtDxwE" },
      { title: "SMT", url: "https://youtu.be/RyQjggawYYQ" },
      { title: "Manipulation Mastered", url: "https://youtu.be/5eleu0U8FCM" },
      { title: "Displacement", url: "https://youtu.be/Pcw7AfHoehw" },
    ]},
    { name: "Confluences", tagline: "Stacking evidence before you take a trade", lectures: [
      { title: "Bisi & Sibi", url: "https://youtu.be/YzUxdREg-Gc" },
      { title: "Internal and External", url: "https://youtu.be/eQJyjimjoqA" },
      { title: "Rejection Blocks", url: "https://youtu.be/cCPL7_icmWY" },
      { title: "Order Blocks", url: "https://youtu.be/z70kRjZ9Xhw" },
      { title: "STDV in PD Arrays", url: "https://youtu.be/NiRb-B3P7VY" },
    ]},
    { name: "Reversal Model", tagline: "Recognizing when the trend is turning", lectures: [
      { title: "Reversals", url: "https://youtu.be/ZoAnjZ1stVQ" },
    ]},
    { name: "Continuations", tagline: "Riding the move, the model, and the mindset behind it", lectures: [
      { title: "PXH/PXL", url: "https://youtu.be/oB2Cym1zZJg" },
      { title: "Model Clarification (Sauce)", url: "https://youtu.be/b6-4fhNOtCE" },
      { title: "When to Long/Short Prem/Disc", url: "https://youtu.be/9i9QjJ4YSJ0" },
      { title: "MMXM", url: "https://youtu.be/seopJ3d5Xu0" },
      { title: "Daily Narrative", url: "https://youtu.be/ETLoGwqtzak" },
      { title: "Psychology (Brain Dump)", url: "https://youtu.be/6TaRfR-ABwc" },
    ]},
    { name: "Final Model Overview", tagline: "Pulling every piece into one complete framework", lectures: [
      { title: "TDP Model", url: "https://youtu.be/qB7H9H8DJRM" },
    ]},
    { name: "Backtestings", bonus: true, tagline: "Prove the strategy to yourself with real data", lectures: [
      { title: "Backtesting 1", url: "#" },
      { title: "Backtesting 2", url: "#" },
      { title: "Backtesting — Continuations Only", url: "#" },
      { title: "Backtesting — Reversals Only", url: "#" },
      { title: "Backtesting Through Only PD Arrays", url: "#" },
    ]}
  ];

  function getYouTubeId(url){
    const m = (url || '').match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([A-Za-z0-9_-]{6,})/);
    return m ? m[1] : null;
  }

  const LECTURES = [];
  SECTORS.forEach((sector, sIdx) => {
    sector.lectures.forEach((lec) => {
      LECTURES.push({
        id: `id${LECTURES.length + 1}`,
        num: String(LECTURES.length + 1).padStart(2, '0'),
        title: lec.title, url: lec.url, ytId: getYouTubeId(lec.url),
        sectorIdx: sIdx, sectorName: sector.name, sectorTagline: sector.tagline, bonus: !!sector.bonus,
      });
    });
  });

  const watched = new Set();
  const saved = new Set();
  const notes = new Map();
  let openId = null;

  const root = document.getElementById('journeyRoot');

  function upNextId(){
    const next = LECTURES.find(l => !watched.has(l.id));
    return next ? next.id : null;
  }

  function panelInner(lec){
    const bigInner = lec.ytId
      ? `<img src="https://img.youtube.com/vi/${lec.ytId}/hqdefault.jpg" alt="">
         <div class="play-big" data-play="${lec.id}"><svg viewBox="0 0 24 24" fill="white"><path d="M8 5v14l11-7z"/></svg></div>`
      : `<div class="placeholder-note">Add a real YouTube link for this lecture to enable playback.</div>`;
    return `
      <div class="panel-card">
        <div class="big-thumb" data-ytid="${lec.ytId || ''}">${bigInner}</div>
        <div class="lesson-header">
          <h3>${lec.title}</h3>
          <button class="icon-btn watch-btn${watched.has(lec.id) ? ' on' : ''}" data-action="watch" data-id="${lec.id}">
            <svg viewBox="0 0 12 12" fill="none"><path d="M2 6l3 3 5-6" stroke="currentColor" stroke-width="1.6"/></svg>
            ${watched.has(lec.id) ? 'Watched' : 'Mark watched'}
          </button>
          <button class="icon-btn save-btn${saved.has(lec.id) ? ' on' : ''}" data-action="save" data-id="${lec.id}">
            <svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none"><path d="M6 3h12a1 1 0 0 1 1 1v16l-7-4-7 4V4a1 1 0 0 1 1-1z"/></svg>
            ${saved.has(lec.id) ? 'Saved' : 'Save for later'}
          </button>
        </div>
        <div class="lesson-section">
          <div class="panel-label">Your notes</div>
          <textarea class="notes-box" data-id="${lec.id}" placeholder="Jot down anything you want to remember...">${notes.get(lec.id) || ''}</textarea>
        </div>
      </div>
    `;
  }

  let side = 'left';
  LECTURES.forEach((lec, i) => {
    if (i === 0 || lec.sectorIdx !== LECTURES[i-1].sectorIdx) {
      if (lec.bonus) {
        const fin = document.createElement('div');
        fin.className = 'finish-divider';
        fin.innerHTML = `<div class="line"></div><div class="label">CORE CURRICULUM COMPLETE</div><div class="line"></div>`;
        root.appendChild(fin);
      }
      const divider = document.createElement('div');
      divider.className = 'sector-divider' + (lec.bonus ? ' bonus' : '');
      divider.innerHTML = `<div class="tag"><span class="dot"></span>${lec.sectorName}</div><div class="tagline">${lec.sectorTagline}</div>`;
      root.appendChild(divider);
    }

    const row = document.createElement('div');
    row.className = 'island-row ' + side;
    row.dataset.id = lec.id;
    row.innerHTML = `
      <div class="island-stack">
        <button class="island-btn" data-id="${lec.id}">
          <div class="island-circle">${lec.num}</div>
          <div class="island-title">${lec.title}</div>
        </button>
        <div class="island-panel" data-panel="${lec.id}"></div>
      </div>
    `;
    root.appendChild(row);
    side = side === 'left' ? 'right' : 'left';
  });

  const endBanner = document.createElement('div');
  endBanner.className = 'end-banner';
  endBanner.innerHTML = `<h3>You've completed the full curriculum.</h3><p>Keep an eye on the Bonus Vault for new drops.</p>`;
  root.appendChild(endBanner);

  function refreshRowClasses(){
    const nextId = upNextId();
    root.querySelectorAll('.island-row').forEach(row => {
      const id = row.dataset.id;
      row.classList.toggle('watched', watched.has(id));
      row.classList.toggle('active', id === openId);
      row.classList.toggle('next', id === nextId);
    });
  }
  refreshRowClasses();

  if ('IntersectionObserver' in window) {
    const io = new IntersectionObserver((entries) => {
      entries.forEach((entry) => {
        if (entry.isIntersecting) { entry.target.classList.add('in-view'); io.unobserve(entry.target); }
      });
    }, { threshold: 0.15 });
    root.querySelectorAll('.island-row, .sector-divider, .finish-divider, .end-banner').forEach(el => io.observe(el));
  } else {
    root.querySelectorAll('.island-row, .sector-divider, .finish-divider, .end-banner').forEach(el => el.classList.add('in-view'));
  }

  function updateProgress(){
    const total = LECTURES.length;
    const pct = total ? watched.size / total : 0;
    const FRAME_HEIGHT = 38;
    const bodyHeight = Math.max(4, pct * FRAME_HEIGHT);
    const candleBody = document.getElementById('candleBody');
    candleBody.style.height = bodyHeight + 'px';
    document.getElementById('candleWick').style.height = Math.min(FRAME_HEIGHT, bodyHeight + 8) + 'px';
    document.getElementById('progressCount').textContent = `${watched.size}/${total}`;
    candleBody.classList.remove('growing');
    void candleBody.offsetWidth;
    candleBody.classList.add('growing');
  }

  function markWatched(id){
    if (watched.has(id)) return;
    watched.add(id);
    updateProgress();
    refreshRowClasses();
    const btn = root.querySelector(`.island-panel[data-panel="${id}"] .watch-btn`);
    if (btn) { btn.classList.add('on'); btn.innerHTML = btn.innerHTML.replace('Mark watched', 'Watched'); }
  }

  root.addEventListener('click', (e) => {
    const playBig = e.target.closest('.play-big');
    if (playBig) {
      const id = playBig.dataset.play;
      const bigThumb = playBig.closest('.big-thumb');
      const ytId = bigThumb.dataset.ytid;
      if (ytId) bigThumb.innerHTML = `<iframe src="https://www.youtube.com/embed/${ytId}?autoplay=1" title="Lecture video" allow="autoplay; encrypted-media" allowfullscreen></iframe>`;
      markWatched(id);
      return;
    }
    const watchBtn = e.target.closest('[data-action="watch"]');
    if (watchBtn) { markWatched(watchBtn.dataset.id); return; }

    const saveBtn = e.target.closest('[data-action="save"]');
    if (saveBtn) {
      const id = saveBtn.dataset.id;
      if (saved.has(id)) { saved.delete(id); saveBtn.classList.remove('on'); saveBtn.lastChild.textContent = 'Save for later'; }
      else { saved.add(id); saveBtn.classList.add('on'); saveBtn.lastChild.textContent = 'Saved'; }
      return;
    }

    if (e.target.closest('.notes-box')) return;

    const islandBtn = e.target.closest('.island-btn');
    if (islandBtn) {
      const id = islandBtn.dataset.id;
      const panel = root.querySelector(`.island-panel[data-panel="${id}"]`);
      const isOpen = panel.classList.contains('open');

      root.querySelectorAll('.island-panel.open').forEach(p => { p.classList.remove('open'); p.innerHTML = ''; });
      openId = null;
      refreshRowClasses();

      if (!isOpen) {
        const lec = LECTURES.find(l => l.id === id);
        panel.innerHTML = panelInner(lec);
        panel.classList.add('open');
        openId = id;
        refreshRowClasses();
      }
    }
  });

  root.addEventListener('input', (e) => {
    if (e.target.classList.contains('notes-box')) notes.set(e.target.dataset.id, e.target.value);
  });

  updateProgress();

  (function(){
    const el = document.getElementById('authArea');
    const user = window.__USER__;
    if (!el) return;
    if (user) {
      const adminLink = user.roles && user.roles.includes('admin') ? '<a href="/admin">Admin</a>' : '';
      el.innerHTML = `${adminLink}<a href="/logout">Logout (${user.username})</a>`;
    } else {
      el.innerHTML = '<a href="/auth/discord">Member Login</a>';
    }
  })();
</script>

</body>
</html>
